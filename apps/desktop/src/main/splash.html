<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电商竞品分析客户端 - 启动中</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 20%, #f2f5fc 0%, #e9edf7 100%);
      color: #1d2129;
      user-select: none;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-card {
      width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 36px 40px;
      box-shadow: 0 16px 40px rgba(0, 30, 80, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      -webkit-app-region: no-drag;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-box {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #165dff 0%, #00b42a 100%);
      box-shadow: 0 8px 24px rgba(22, 93, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      margin-bottom: 20px;
      position: relative;
    }

    .logo-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: inherit;
      opacity: 0.4;
      animation: pulse 2s infinite ease-out;
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1d2129;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #86909c;
      margin-bottom: 28px;
    }

    /* 进度条外壳 */
    .progress-wrapper {
      width: 100%;
      margin-bottom: 22px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e5e6eb;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-inner {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #165dff 0%, #3491fa 50%, #00b42a 100%);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #4e5969;
    }

    .status-text {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .percent-text {
      font-weight: 700;
      color: #165dff;
      font-variant-numeric: tabular-nums;
    }

    /* 阶段步骤清单 */
    .steps-list {
      width: 100%;
      background: #f7f8fa;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #86909c;
      transition: color 0.3s;
    }

    .step-item.active {
      color: #165dff;
      font-weight: 600;
    }

    .step-item.done {
      color: #00b42a;
    }

    .step-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c9cdd4;
    }

    .step-item.active .step-dot {
      background: #165dff;
      box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.2);
    }

    .step-item.done .step-dot {
      background: #00b42a;
    }

    /* 底部辅助与重试操作 */
    .footer-actions {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .retry-btn {
      display: none;
      background: #fff;
      border: 1px solid #dcdfe6;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      color: #1d2129;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .retry-btn:hover {
      border-color: #165dff;
      color: #165dff;
    }

    .tips-text {
      font-size: 11px;
      color: #c9cdd4;
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <div class="logo-box">
      <div class="logo-pulse"></div>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    </div>

    <h1>电商竞品分析客户端</h1>
    <p class="subtitle">AI 智能采集 · 深度多维透视 · 全渠道商品上架</p>

    <div class="progress-wrapper">
      <div class="progress-bar-bg">
        <div class="progress-bar-inner" id="progressBar"></div>
      </div>
      <div class="progress-info">
        <div class="status-text" id="statusText">
          正在初始化本地运行时环境...
        </div>
        <div class="percent-text" id="percentText">15%</div>
      </div>
    </div>

    <div class="steps-list">
      <div class="step-item done" id="step1">
        <div class="step-dot"></div>
        <span>本地安全沙箱与运行时环境初始化</span>
      </div>
      <div class="step-item active" id="step2">
        <div class="step-dot"></div>
        <span>注册本地 SQLite 与 RPA 数据通道</span>
      </div>
      <div class="step-item" id="step3">
        <div class="step-dot"></div>
        <span>正在建立应用核心服务连接 (127.0.0.1:5173)</span>
      </div>
      <div class="step-item" id="step4">
        <div class="step-dot"></div>
        <span>载入工作区与用户授权状态</span>
      </div>
    </div>

    <div class="footer-actions">
      <span class="tips-text" id="timeoutTip">系统就绪后将自动进入</span>
      <button class="retry-btn" id="retryBtn" onclick="location.reload()">重新连接</button>
    </div>
  </div>

  <script>
    const progressBar = document.getElementById('progressBar');
    const percentText = document.getElementById('percentText');
    const statusText = document.getElementById('statusText');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step4 = document.getElementById('step4');
    const retryBtn = document.getElementById('retryBtn');
    const timeoutTip = document.getElementById('timeoutTip');

    let currentPercent = 15;

    // 渐进式平滑推进进度动画
    const interval = setInterval(() => {
      if (currentPercent < 45) {
        currentPercent += 10;
        progressBar.style.width = currentPercent + '%';
        percentText.innerText = currentPercent + '%';
        if (currentPercent >= 35) {
          step2.className = 'step-item done';
          step3.className = 'step-item active';
          statusText.innerText = '正在探测应用核心服务 (127.0.0.1:5173)...';
        }
      } else if (currentPercent < 88) {
        currentPercent += 3;
        progressBar.style.width = currentPercent + '%';
        percentText.innerText = currentPercent + '%';
      }
    }, 400);

    // 超过 10 秒未完成时展示友好重试
    setTimeout(() => {
      retryBtn.style.display = 'inline-block';
      timeoutTip.innerText = '首次编译启动需要稍候，或点击按钮重试';
    }, 10000);

    // 供 Electron 主进程注入更新进度
    window.updateLaunchProgress = (percent, message) => {
      progressBar.style.width = percent + '%';
      percentText.innerText = percent + '%';
      if (message) statusText.innerText = message;
      if (percent >= 90) {
        step3.className = 'step-item done';
        step4.className = 'step-item active';
      }
      if (percent >= 100) {
        step4.className = 'step-item done';
        clearInterval(interval);
      }
    };
  </script>
</body>
</html>
