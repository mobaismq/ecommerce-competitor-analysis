appId: com.ecommercecompetitoranalysis.desktop
productName: 电商竞品分析
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - resources/python/**
  - resources/skills/**
extraResources:
  - from: resources/python
    to: python
    filter:
      - '**/*'
      - '!**/__pycache__/**'
  - from: ../../skills
    to: skills
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
mac:
  target:
    - dmg
  category: public.app-category.business
win:
  target:
    - nsis
linux:
  target:
    - AppImage
publish:
  provider: generic
  url: ${env.UPDATE_URL}
